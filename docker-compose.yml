version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipl-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ipl_betting
      POSTGRES_USER: ipl_user
      POSTGRES_PASSWORD: ipl_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipl_user -d ipl_betting"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ipl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ipl-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ipl_user:ipl_password@postgres:5432/ipl_betting
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/src

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: ipl-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./apps/frontend/.env
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    volumes:
      - ./apps/frontend/src:/app/src

volumes:
  postgres_data:
  redis_data:
